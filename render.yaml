services:
  - type: web
    name: eventra-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: EVENTRA_JWT_SECRET
        generateValue: true
      - key: EVENTRA_CORS_ORIGIN
        sync: false
